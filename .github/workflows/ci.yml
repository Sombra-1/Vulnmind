name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r dev-requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Smoke test CLI entry point
        run: vulnmind --version

      - name: Build and inspect wheel
        run: |
          python -m build --wheel
          python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0]; names = set(zipfile.ZipFile(wheel).namelist()); required = {'vulnmind/knowledge/services.json', 'vulnmind/enrichers/kev.py', 'vulnmind/enrichers/exploitdb.py', 'vulnmind/enrichers/intelligence.py'}; missing = required - names; assert not missing, f'missing wheel files: {sorted(missing)}'"
